
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Friendzy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 320px;
            box-shadow: 0 5px 20px #0001;
        }

        h1 { color: #6c4cff; }

        input {
            width: 100%;
            padding: 10px 0;
            margin: 8px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #6c4cff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        a { color: #6c4cff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>💜 Friendzy</h1>
        <h2>Welcome Back!</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>

        <p>New user?
            <a href="{% url 'register' %}">Create Account</a>
        </p>

        <a href="{% url 'home' %}">Back to Home</a>
    </div>
</body>
</html>
