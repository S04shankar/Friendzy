
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Friendzy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: min(340px, 80%);
        }
        h1 { color: #6c4cff; }
        input {
            width: 100%;
            padding: 10px 0;
            margin: 8px 0;
        }
        button {
            background: #6c4cff;
            color: white;
            border: 0;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
        }
        .helptext { font-size: 12px; }
        a { color: #6c4cff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>💜 Friendzy</h1>
        <h2>Create Account</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>

        <p>Already registered? <a href="{% url 'login' %}">Login</a></p>
        <p><a href="{% url 'home' %}">Back to Home</a></p>
    </div>
</body>
</html>
